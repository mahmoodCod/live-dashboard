<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/socket.io-client@4.8.3/dist/socket.io.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Live Orders Dashboard</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Status</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>

    <script>
        const socket = io('http://localhost:3000/orders-live');

        function addOrderToTable(order, prepend = true) {
            const tbody = document.getElementById('ordersTable');
            const tr = document.createElement('tr');
            tr.innerHTML = `
            <td>${order.id}</td>
            <td>${order.productName}</td>
            <td>${order.quantity}</td>
            <td>${order.status}</td>
            <td>${new Date(order.createdAt).toLocaleString()}</td>
            `;
            if (prepend) {
                tbody.prepend(tr);
            } else {
                tbody.appendChild(tr);
            }

            socket.on('initialOrders', orders => {
                orders.revers().forEach(order => addOrderToTable(order, false));
            });

            socket.on('newOrder', order => {
                addOrderToTable(order);
            });

            if (Notification.permission === 'granted') {
                new Notification('New Order', {
                    body: `${order.productName} x ${order.quantity}`
                });
            }

            if (Notification.permission === 'granted') {
                Notification.requestPermission();
            }
        }
    </script>
</body>
</html>
